version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "10:00"
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    angular:
      patterns:
        - "@angular/*"
        - "@angular-devkit/*"
        - "@angular-eslint/*"
        - "ng-packagr"
